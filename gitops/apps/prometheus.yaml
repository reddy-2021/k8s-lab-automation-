apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: prometheus
  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/YOUR_GITHUB_USERNAME/k8s-production-platform.git
    targetRevision: main
    path: gitops/helm/prometheus

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
