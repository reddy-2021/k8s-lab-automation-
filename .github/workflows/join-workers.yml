name: Join Kubernetes Worker Nodes

on:
  workflow_dispatch:

jobs:
  join-workers:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add Known Hosts
        run: |
          ssh-keyscan -H ${{ secrets.MASTER_IP }} >> ~/.ssh/known_hosts
          ssh-keyscan -H ${{ secrets.WORKER1_IP }} >> ~/.ssh/known_hosts

      - name: Join Worker
        run: |
          JOIN_CMD=$(ssh -i ~/.ssh/id_rsa \
            ${{ secrets.SSH_USER }}@${{ secrets.MASTER_IP }} \
            "sudo kubeadm token create --print-join-command")

          ssh -i ~/.ssh/id_rsa \
            ${{ secrets.SSH_USER }}@${{ secrets.WORKER1_IP }} \
            "sudo kubeadm reset -f && sudo $JOIN_CMD"
