name: Install ArgoCD

on:
  workflow_dispatch:

jobs:

  install:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - name: Configure SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

    - name: Install ArgoCD
      run: |
        ssh \
        -o StrictHostKeyChecking=no \
        -i ~/.ssh/id_rsa \
        ubuntu@${{ secrets.MASTER_PUBLIC_IP }} \
        'bash -s' < scripts/install-argocd.sh
